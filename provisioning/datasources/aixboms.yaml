# Provisioned datasource: AixBOMS REST API via the Infinity plugin.
#
# Grafana reads this file once on container start and creates / updates the
# datasource. To change auth, URL, or headers, edit this file and restart
# the container (`docker compose restart grafana`).
#
# Inside the container, the AixBOMS server on your host is reachable at
# http://host.docker.internal:8080 (see docker-compose.yml -> extra_hosts).

apiVersion: 1

datasources:
  - name: AixBOMS REST
    uid: aixboms-rest
    type: yesoreyeram-infinity-datasource
    access: proxy
    # Base URL — individual queries append the endpoint path.
    url: http://host.docker.internal:8080
    isDefault: true
    editable: true
    basicAuth: true
    basicAuthUser: ${AIXBOMS_USER}
    jsonData:
      # Restrict outbound requests to this host. Add more entries if you
      # later query additional AixBOMS environments.
      allowedHosts:
        - http://host.docker.internal:8080
      auth_method: basicAuth
      timeoutInSeconds: 30
    # Credentials are injected from the .env file (never commit real passwords).
    # Create/edit .env next to docker-compose.yml, then run: docker compose up -d
    secureJsonData:
      basicAuthPassword: ${AIXBOMS_PASSWORD}
